# Labels PRs from their branch prefix so auto-generated release notes get categorised.
name: PR labeler

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    # fork PRs and Dependabot PRs get a read-only token, so labelling would fail there
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/labeler@v7
